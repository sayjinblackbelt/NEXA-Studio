<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="NEXA Studio — biblioteca dinâmica de modelos e templates.">
<title>NEXA Studio — Modelos</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
.models-page{background:#0b0b0b;color:#f4f4f0;min-height:100vh}.models-header{padding:22px 0;border-bottom:1px solid #2b2b2b;background:#0b0b0b}.models-header a{color:#f4f4f0}.models-main{padding:58px 0 90px}.models-intro{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(280px,.7fr);gap:48px;align-items:end;margin-bottom:42px}.models-intro h1{font-size:clamp(4rem,10vw,9rem);letter-spacing:-.06em;line-height:.82;margin:10px 0}.models-intro em{font-style:normal;color:#888}.models-note{max-width:460px;line-height:1.65;color:#bcbcb6;border-left:2px solid #d9ff00;padding-left:18px}.models-page .kicker{color:#d9ff00}.models-controls{display:grid;grid-template-columns:1fr 190px;gap:12px;margin-bottom:18px}.models-controls input,.models-controls select{font:inherit;padding:16px 18px;border:1px solid #393939;background:#151515;color:#f4f4f0;outline:none}.models-controls input:focus,.models-controls select:focus{border-color:#d9ff00}.model-filters{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:38px}.filter{border:1px solid #393939;background:#111;color:#aaa;padding:9px 14px;cursor:pointer}.filter:hover,.filter.active{background:#d9ff00;color:#0b0b0b;border-color:#d9ff00}.models-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:#333;border:1px solid #333}.model-card{background:#111;padding:26px;min-height:300px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;transition:transform .25s,background .25s}.model-card:before{content:'';position:absolute;right:-70px;top:-70px;width:150px;height:150px;border:1px solid #333;border-radius:50%}.model-card:hover{background:#171717}.model-card.is-featured{background:#141414}.model-card.is-featured:after{content:'FEATURED';position:absolute;top:14px;right:14px;font-size:.62rem;letter-spacing:.13em;color:#d9ff00}.model-top{display:flex;justify-content:space-between;gap:12px;color:#777}.model-category{font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:#aaa}.model-card h2{font-size:1.65rem;letter-spacing:-.03em;margin:28px 0 10px;max-width:85%}.model-card p{color:#999;line-height:1.55;max-width:95%}.model-tags{display:flex;flex-wrap:wrap;gap:6px;margin:18px 0}.model-tag{font-size:.68rem;padding:5px 8px;background:#202020;color:#aaa}.model-actions{display:flex;gap:8px}.model-actions button{font:inherit;font-size:.82rem;padding:10px 13px;cursor:pointer;border:1px solid #d9ff00;background:#d9ff00;color:#0b0b0b}.model-actions .secondary{background:transparent;color:#f4f4f0;border-color:#444}.model-actions .secondary:hover{border-color:#f4f4f0}.empty-models{padding:60px;text-align:center;color:#999;background:#111}.modal-backdrop{position:fixed;inset:0;background:#000d;display:grid;place-items:center;padding:20px;z-index:20}.modal{background:#111;color:#f4f4f0;border:1px solid #444;max-width:780px;width:100%;max-height:86vh;overflow:auto;padding:34px}.modal-head{display:flex;justify-content:space-between;gap:20px}.modal-close{border:0;background:transparent;color:#f4f4f0;font-size:1.8rem;cursor:pointer}.modal pre{white-space:pre-wrap;font:inherit;line-height:1.65;background:#181818;border-left:2px solid #d9ff00;padding:20px;margin-top:24px;color:#ddd}.models-footer{padding:28px 0;border-top:1px solid #2b2b2b;color:#777}@media(max-width:800px){.models-intro{grid-template-columns:1fr;gap:22px}.models-intro h1{font-size:clamp(3.4rem,18vw,6rem)}.models-controls{grid-template-columns:1fr}.models-grid{grid-template-columns:1fr}.model-card{min-height:260px}}
</style>
</head>
<body class="models-page">
<header class="models-header"><div class="wrap nav-wrap"><a class="brand" href="index.html">NEXA<span>®</span></a><nav aria-label="Navegação"><a href="index.html">Studio</a><a href="studio.html">NEXA Lab</a></nav></div></header>
<main class="wrap models-main">
<section class="models-intro"><div><p class="kicker">NEXA STUDIO / TEMPLATE LIBRARY</p><h1>Modelos<br><em>que aceleram.</em></h1></div><p class="models-note">Estruturas para pensar, criar, apresentar e construir. Uma biblioteca viva com lógica de studio criativo — menos formulário genérico, mais direção.</p></section>
<section class="models-controls" aria-label="Busca e ordenação"><input id="model-search" type="search" placeholder="Buscar por nome, categoria ou tag..." aria-label="Buscar modelo"><select id="model-sort" aria-label="Ordenar modelos"><option value="featured">Destaques</option><option value="name">Nome</option><option value="category">Categoria</option></select></section>
<div id="model-filters" class="model-filters"></div>
<section id="models-grid" class="models-grid" aria-live="polite"></section>
</main>
<footer class="models-footer"><div class="wrap">NEXA Studio · Biblioteca de modelos · Prototype / Concept Agency</div></footer>
<div id="model-modal-root"></div>
<script src="js/modelos.js"></script>
</body></html>
