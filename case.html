<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="NEXA Studio — concept case."><title>NEXA Studio — Case</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/visual-consistency.css"><link rel="stylesheet" href="css/visitor-counter.css"><style>
body{margin:0;background:#050505;color:#f2f2ee;font-family:"DM Sans",sans-serif}.case-page{min-height:100vh;background-image:linear-gradient(rgba(242,242,238,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(242,242,238,.045) 1px,transparent 1px);background-size:80px 80px}.case-header{border-bottom:1px solid rgba(242,242,238,.1);background:rgba(5,5,5,.8);backdrop-filter:blur(14px);position:sticky;top:0;z-index:10}.case-nav{height:70px;display:flex;align-items:center;justify-content:space-between}.case-nav a{color:#f2f2ee;text-decoration:none}.case-nav .brand{font:700 1.2rem "Space Grotesk"}.case-nav .back{font-size:.68rem;letter-spacing:.12em;text-transform:uppercase}.case-main{padding:90px 0}.case-hero{display:grid;grid-template-columns:1fr .75fr;gap:60px;align-items:end;margin-bottom:55px}.case-kicker{font-size:.65rem;letter-spacing:.18em;color:#d9ff00;text-transform:uppercase}.case-hero h1{font:600 clamp(4rem,10vw,9rem)/.8 "Space Grotesk";letter-spacing:-.08em;margin:18px 0}.case-hero .lead{color:#98968f;line-height:1.7;max-width:500px}.hero-art{border:1px solid rgba(242,242,238,.14);background:#101114;overflow:hidden}.hero-art img{width:100%;display:block;aspect-ratio:16/10;object-fit:contain}.case-meta-grid{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid rgba(242,242,238,.14);border-bottom:1px solid rgba(242,242,238,.14);margin-bottom:55px}.meta{padding:20px 0}.meta+ .meta{border-left:1px solid rgba(242,242,238,.14);padding-left:24px}.meta small{display:block;color:#666;font-size:.58rem;letter-spacing:.15em;text-transform:uppercase;margin-bottom:8px}.meta strong{font:500 1rem "Space Grotesk"}.materials{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}.material{border:1px solid rgba(242,242,238,.12);background:#101114;overflow:hidden;text-decoration:none;color:#f2f2ee}.material img{display:block;width:100%;aspect-ratio:16/10;object-fit:contain;background:#101114;transition:transform .45s}.material:hover img{transform:scale(1.025)}.material span{display:block;padding:14px 16px;font-size:.67rem;letter-spacing:.1em;text-transform:uppercase;color:#929089}.case-footer{margin-top:70px;padding-top:30px;border-top:1px solid rgba(242,242,238,.1);display:flex;justify-content:space-between;color:#666;font-size:.65rem;letter-spacing:.1em;text-transform:uppercase}.error{padding:120px 0;text-align:center}.error h1{font:600 4rem "Space Grotesk"}@media(max-width:800px){.case-main{padding:60px 0}.case-hero{grid-template-columns:1fr;gap:25px}.case-hero h1{font-size:clamp(4rem,18vw,7rem)}.case-meta-grid{grid-template-columns:1fr}.meta+.meta{border-left:0;border-top:1px solid rgba(242,242,238,.14);padding-left:0}.materials{grid-template-columns:1fr}.case-footer{display:block}.case-footer>*{margin:8px 0}}
</style></head><body class="case-page"><header class="case-header"><div class="wrap case-nav"><a class="brand" href="index.html">NEXA<span>®</span></a><a class="back" href="index.html#work">← Voltar ao portfolio</a></div></header><main id="app" class="case-main"><div class="wrap">Carregando case…</div></main><script>
(async()=>{const app=document.querySelector("#app"),id=new URLSearchParams(location.search).get("id");try{const r=await fetch("data/portfolio.json",{cache:"no-store"});const data=await r.json();const p=data.find(x=>x.id===id);if(!p)throw new Error("case");const esc=v=>String(v??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));const primary="assets/mockups/"+encodeURIComponent(p.id)+".svg";const fallback=p.materials?.[0]?.file;app.innerHTML=`<section class="case-hero"><div><p class="case-kicker">${esc(p.category)} / CONCEPT CASE</p><h1>${esc(p.name)}</h1><p class="lead">${esc(p.description)}</p></div><div class="hero-art"><img src="${primary}" alt="Mockup conceitual ${esc(p.name)}" onerror="this.onerror=null;this.src='assets/mockups/'+encodeURIComponent('${fallback}')"></div></section><section class="case-meta-grid"><div class="meta"><small>Disciplina</small><strong>${esc(p.type)}</strong></div><div class="meta"><small>Direção</small><strong>Estratégia + design + tecnologia</strong></div><div class="meta"><small>Materiais</small><strong>${p.materials?.length||0} aplicações</strong></div></section><section><p class="case-kicker">VISUAL SYSTEM / APPLICATIONS</p><div class="materials">${(p.materials||[]).map(m=>`<a class="material" href="assets/mockups/${encodeURIComponent(m.file)}" target="_blank" rel="noopener"><img src="assets/mockups/${encodeURIComponent(m.file)}" alt="${esc(m.label)} — ${esc(p.name)}"><span>${esc(m.label)}</span></a>`).join("")}</div></section><footer class="case-footer"><span>NEXA Studio · ${esc(p.name)}</span><span class="visitor-counter" data-visitor-counter></span></footer>`;const s=document.createElement("script");s.src="js/visitor-counter.js";document.body.appendChild(s)}catch(e){app.innerHTML='<div class="error wrap"><p class="case-kicker">NEXA / CASE</p><h1>Case não encontrado.</h1><a href="index.html#work">Voltar ao portfolio</a></div>'}})();
</script></body></html>
